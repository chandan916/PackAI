# Zerops Recipe for PackAI (3D Container Packing Optimizer)
# Documentation: https://docs.zerops.io/references/zerops-yml

zerops:
  # ==========================================
  # 1. PackAI Backend Service (Express + TS)
  # ==========================================
  - setup: backend
    build:
      base: nodejs@20
      buildCommands:
        - cd packai/backend && npm install
        - cd packai/backend && npx prisma generate
        - cd packai/backend && npm run build
      deployFiles:
        - packai/backend/dist
        - packai/backend/prisma
        - packai/backend/package.json
        - packai/backend/node_modules
    run:
      base: nodejs@20
      ports:
        - port: 5000
          httpSupport: true
      envVariables:
        PORT: 5000
        DATABASE_URL: "file:./dev.db"
      start: sh -c "cd packai/backend && node dist/server.js"

  # ==========================================
  # 2. PackAI Frontend Service (Next.js)
  # ==========================================
  - setup: frontend
    build:
      base: nodejs@20
      buildCommands:
        - cd packai/frontend && npm install
        - cd packai/frontend && npm run build
      deployFiles:
        - packai/frontend/.next
        - packai/frontend/public
        - packai/frontend/next.config.mjs
        - packai/frontend/package.json
        - packai/frontend/node_modules
    run:
      base: nodejs@20
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        PORT: 3000
        BACKEND_INTERNAL_URL: "http://backend:5000"
      start: sh -c "cd packai/frontend && npx next start -p 3000"
